name: imagenet64_nfmd
method: nfmd
stage: nfmd
seed: 42
dataset:
  epoch_samples: 0
  flip: true
model:
  img_size: 64
  out_channels: 3
  channels: 384
  patch_size: 2
  num_blocks: 8
  num_layers: 8
  num_classes: 1000
  precision: bf16
  attn_impl: causal_xla
  clip_range: 1.0
training:
  epochs: 300
  batch_size: 256
  lr: 0.0004
  warmup_steps: 25000
  warmup_lr: 1.0e-06
  emas:
  - 0.9995
  - 0.9999
  log_steps: 100
  checkpoint_epochs: 50
  final_lr: 0.0001
  cooldown_start: 150
  cooldown_end: 200
objective:
  s_max: 0.15
  label_dropout: 0.1
evaluation:
  samples: 50000
  batch_size: 80
  cfg:
  - 3.3
  interval:
  - 0.0
  - 1.0
  emas:
  - 0.9995
  - 0.9999
