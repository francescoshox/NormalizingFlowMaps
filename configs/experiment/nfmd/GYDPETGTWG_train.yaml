# @package _global_
defaults:
  - override /model: nfmd
  - override /data: single_system/GYDPETGTWG
  - override /trainer: ddp
  - override /callbacks: nfmd_train
task_name: nfmd_GYDPETGTWG_train
tags: [nfmd, GYDPETGTWG]
seed: 47
num_samples: 200000
model:
  nfmd_t_max: 0.05
  mean_free_prior: false
  prior:
    std: 1.0
  net:
    channels: 384
    num_blocks: 6
    num_layers: 6
    clip_range: 3.0
    img_size: 414
    logdet_sum: false
  eval_logdet_sum: true
  optimizer:
    lr: 2e-4
  scheduler:
    _target_: torch.optim.lr_scheduler.OneCycleLR
    _partial_: true
    max_lr: ${model.optimizer.lr}
    pct_start: 0.05
    anneal_strategy: cos
    cycle_momentum: false
    div_factor: 500.0
    final_div_factor: 1.0
  source_energy_config:
    sample_batch_size: 10000
    energy_batch_size: 10000
    grad_batch_size: 2048
    use_com_adjustment: true
data:
  batch_size: 2048
  com_augmentation: true
  num_workers: 4
  pin_memory: true
callbacks:
  sampling_evaluation:
    sampler: ${sampler}
trainer:
  devices: 1
  num_nodes: 1
  max_epochs: 3000
  check_val_every_n_epoch: 100
