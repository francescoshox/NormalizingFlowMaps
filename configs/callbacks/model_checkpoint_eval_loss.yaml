model_checkpoint_eval_loss:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: epoch_{epoch:03d}_eval_loss
  monitor: val/mean/eval-loss
  verbose: false
  save_last: false
  save_top_k: 1
  mode: min
  auto_insert_metric_name: false
  save_weights_only: false
  every_n_train_steps:
  train_time_interval:
  every_n_epochs:
  save_on_train_epoch_end:
