_target_: transferable_samplers.nn.transferable_itar.transferable_twotime_itarflow.TransferableTwoTimeITarFlow
input_dimension: 3 # 3D coordinates
channels: 384
max_num_tokens: ${data.num_atoms}
num_blocks: 8
layers_per_block: 8
head_dim: 64
use_qkln: true
lookahead_conditioning: false
permutation_keys:
  - n2c_residue-by-residue_standard
  - n2c_residue-by-residue_standard_flip
cond_embed:
  _target_: transferable_samplers.nn.embedder.ConditionalEmbedder
  hidden_dim: ${model.net.channels}
  output_dim: ${model.net.channels}
  sinusoid_div_value: 1000
clip_range: 5.0
gated: false
