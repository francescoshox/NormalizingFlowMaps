_target_: transferable_samplers.samplers.smc_sampler.SMCSampler
num_samples: ${num_samples}
init_eps: 5e-4
num_annealing_steps: 50
ess_threshold: 1.0
resampling_method: systematic
energy_cutoff_filter: 100.0
logw_quantile_filter: 0.002
use_metropolis: true
adaptive_step_size: true
log_traj_freq: 10
